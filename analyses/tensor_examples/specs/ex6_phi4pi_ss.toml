l = 2
s = 2
ls = { psi2s = [[2, 2]], f2 = [[2, 0]] }
tree = { psi2s = ["phi", "f2"], f2 = ["sigA", "sigB"], sigA = ["Pip", "Pim2"], sigB = ["Pip2", "Pim"] }
[[channel]]
name = "u_phif2_ss_23"
l = 2
s = 3
ls = { psi2s = [[2, 3]], f2 = [[2, 0]] }
tree = { psi2s = ["phi", "f2"], f2 = ["sigA", "sigB"], sigA = ["Pip", "Pim"], sigB = ["Pip2", "Pim2"] }
