[[basis]]
name   = "helicity_cascade"
kernel = "helicity_cascade"
files  = ["ex6_phi4pi_ss_cascade.npy"]
env    = { TENSOR_BASIS = "helicity", HELICITY_LAYER = "1" }

[[basis]]
name   = "cartesian"
kernel = "covariant"
env    = { TENSOR_BASIS = "cartesian", HELICITY_LAYER = "0" }

[[basis]]
name   = "helicity"
kernel = "helicity"
env    = { TENSOR_BASIS = "helicity", HELICITY_LAYER = "1" }
