ls = { psi2s = [[4, 3]], f2 = [[2, 0]] }
tree = { psi2s = ["phi", "f2"], f2 = ["sigA", "sigB"], sigA = ["Pip", "Pim"], sigB = ["Pip2", "Pim2"] }
