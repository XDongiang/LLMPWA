# 例 6：psi(2S) -> phi pi+pi-pi+pi- -> K+K- pi+pi-pi+pi-  ——  f_J -> σσ
#
# 文档 `document/ψ衰变到介子的分波分析协变张量形式.md` 624–795 行，
# 原始 tex：`documentation/jpsipwa1.tex` 706–873 行（已与 md 逐式核对，一致）。
#
# 末态编号照文档：K+ = 1、K- = 2、pi+ = 3、pi- = 4、pi+ = 5、pi- = 6。
#
# 例 6 有三条子分支，**拆成三份 spec**（一份一个家族）：
#
#   | spec                    | 子分支            | 文档行   | 道数 | A1        |
#   |-------------------------|-------------------|----------|------|-----------|
#   | `ex6_phi4pi_ss.toml`    | f_J -> sigma sigma| 630–674  | 14   | ✅ 7e-15  |
#   | `ex6_phi4pi_rr.toml`    | f_J -> rho rho    | 676–730  | 14   | 混合，见下 |
#   | `ex6_phi4pi_f2s.toml`   | f_2 -> f_2(1270)s | 732–775  | 10   | ⚠️ 通不过 |
#
# 拆开的理由：三条分支的**状态不同**（两条可用、一条不可用），混在一份 spec
# 里会让"这份 spec 过不过 A1"变成一个没法回答的问题 —— A1 是逐道的，
# 一份 spec 里既有过的道又有不过的道，报告里只能说"部分过"，很容易读错。
#
# 本份只做 **f_J -> sigma sigma**（14 条道）：f_0 的 2 个 (l,s) × 2 配对 +
# f_2 的 5 个 (l,s) × 2 配对。σ 是标量，所以
# `T2_ss(frame, a1,a2,b1,b2) = T2_cov(frame, a1+a2, b1+b2)` ——
# 没有 1⊗1→2 的无迹化问题，A1 = 6.97e-15（逐道）。
#
# 六体末态 + 三层 -> 只有 helicity_cascade 能路由（协变/螺度是手写道）。

[chain]
name = "ex6_phi4pi_ss"
top = "psi2s"
output = "../generated/ex6_phi4pi_ss"
l_max = 4
# 三份 spec 共用一个 chain 目录（道名不重叠）—— 与 ex5_kst2/ex5_kst0 同模式
chain_name = "ex6_phi4pi"
suffix = "_phi4pi_ss"
# (l,s) 不是完备标签：同一组 (l,s) 有多个 σσ/ρρ 配对（多条道）
check_channels = false

psi_mass = 3.686

[input]
keys = ["Kp", "Km", "Pip", "Pim", "Pip2", "Pim2"]
layout = "x,y,z,E"

[particles.psi2s]
J = 1
mass = 3.686
parity = -1
daughters = ["phi", "f2"]

[particles.phi]
J = 1
mass = 1.019461
parity = -1
l = 1
daughters = ["Kp", "Km"]

# KKbar 那一对：文档里 f_0 与 f_2 都从 pi+pi- 重建，不来自 KK。
# 这里写成 phi + fJ，fJ 由四个 pi 重建（见下面的 sigma 节点）。
[particles.f2]
J = 2
mass = 1.9          # 虚拟质量，见 ../data/make_phi4pi.py 的说明
parity = 1
l = 2
daughters = ["sigA", "sigB"]

[particles.f0]
J = 0
mass = 1.9
parity = 1
l = 0
daughters = ["sigA", "sigB"]

[particles.sigA]
J = 0
mass = 0.5
parity = 1
l = 0
daughters = ["Pip", "Pim"]

[particles.sigB]
J = 0
mass = 0.5
parity = 1
l = 0
daughters = ["Pip2", "Pim2"]

[particles.Kp]
J = 0
mass = 0.493677
parity = -1

[particles.Km]
J = 0
mass = 0.493677
parity = -1

[particles.Pip]
J = 0
mass = 0.13957039
parity = -1

[particles.Pim]
J = 0
mass = 0.13957039
parity = -1

[particles.Pip2]
J = 0
mass = 0.13957039
parity = -1

[particles.Pim2]
J = 0
mass = 0.13957039
parity = -1

# ---- f_0 -> sigma sigma：两个配对，两套 (l,s) ----
#
# 第一个配对 (34)(56)：sigA = Pip+Pim, sigB = Pip2+Pim2（就是上面的树）
# 第二个配对 (36)(45)：sigA = Pip+Pim2, sigB = Pip2+Pim

[[channel]]
name = "u_phif0_ss_01"
l = 0
s = 1
ls = { psi2s = [[0, 1]], f0 = [[0, 0]] }
tree = { psi2s = ["phi", "f0"], f0 = ["sigA", "sigB"], sigA = ["Pip", "Pim"], sigB = ["Pip2", "Pim2"] }
[[channel]]
name = "u_phif0_ss_01_b"
l = 0
s = 1
ls = { psi2s = [[0, 1]], f0 = [[0, 0]] }
tree = { psi2s = ["phi", "f0"], f0 = ["sigA", "sigB"], sigA = ["Pip", "Pim2"], sigB = ["Pip2", "Pim"] }
[[channel]]
name = "u_phif0_ss_21"
l = 2
s = 1
ls = { psi2s = [[2, 1]], f0 = [[0, 0]] }
tree = { psi2s = ["phi", "f0"], f0 = ["sigA", "sigB"], sigA = ["Pip", "Pim"], sigB = ["Pip2", "Pim2"] }
[[channel]]
name = "u_phif0_ss_21_b"
l = 2
s = 1
ls = { psi2s = [[2, 1]], f0 = [[0, 0]] }
tree = { psi2s = ["phi", "f0"], f0 = ["sigA", "sigB"], sigA = ["Pip", "Pim2"], sigB = ["Pip2", "Pim"] }
[[channel]]
name = "u_phif2_ss_01"
l = 0
s = 1
ls = { psi2s = [[0, 1]], f2 = [[2, 0]] }
tree = { psi2s = ["phi", "f2"], f2 = ["sigA", "sigB"], sigA = ["Pip", "Pim"], sigB = ["Pip2", "Pim2"] }
[[channel]]
name = "u_phif2_ss_01_b"
l = 0
s = 1
ls = { psi2s = [[0, 1]], f2 = [[2, 0]] }
tree = { psi2s = ["phi", "f2"], f2 = ["sigA", "sigB"], sigA = ["Pip", "Pim2"], sigB = ["Pip2", "Pim"] }
[[channel]]
name = "u_phif2_ss_21"
l = 2
s = 1
ls = { psi2s = [[2, 1]], f2 = [[2, 0]] }
tree = { psi2s = ["phi", "f2"], f2 = ["sigA", "sigB"], sigA = ["Pip", "Pim"], sigB = ["Pip2", "Pim2"] }
[[channel]]
name = "u_phif2_ss_21_b"
l = 2
s = 1
ls = { psi2s = [[2, 1]], f2 = [[2, 0]] }
tree = { psi2s = ["phi", "f2"], f2 = ["sigA", "sigB"], sigA = ["Pip", "Pim2"], sigB = ["Pip2", "Pim"] }
[[channel]]
name = "u_phif2_ss_22"
l = 2
s = 2
ls = { psi2s = [[2, 2]], f2 = [[2, 0]] }
tree = { psi2s = ["phi", "f2"], f2 = ["sigA", "sigB"], sigA = ["Pip", "Pim"], sigB = ["Pip2", "Pim2"] }
[[channel]]
