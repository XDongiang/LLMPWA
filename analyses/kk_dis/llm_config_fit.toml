# llm代码生成，kk_fit，jax原生分布式版本

[ref]
code_template = ["gen/templates/fit.py","gen/templates/shared.py","gen/templates/physics_functions.py"]
resonances_config = {"type" = "file", "path" = "resonances_config.toml"}


[stages.config_strip]
kind = "python"
handler = {"type" = "file", "path" = "gen/handlers/config_strip_handler.py", "function" = "config_strip_handler"}
output_type = "json"
output.free_params = {"type" = "file", "path" = "run/free_params.toml"}
output.stripped_config = {"type" = "file", "path" = "gen/fragments/stripped_config.toml"}
output.free_params_range = {"type" = "file", "path" = "gen/fragments/free_params_range.toml"}
output.all_sbc = {"type" = "direct"}
output.all_amp = {"type" = "direct"}
output.all_sbc_amp = {"type" = "direct"}

[stages.make_initial_args]
# python生成辅助函数，从free_param中读取变量
kind = "python"
handler = {"type" = "file", "path" = "gen/handlers/make_initial_args_handler.py", "function" = "make_initial_args_handler"}
input = {"path" = "run/free_params.toml"}
output_type = "python"
output.all = {"type" = "file", "path" = "gen/fragments/make_initial_args.py"}

[stages.save_results]
# python生成辅助函数，以free_param格式，保存拟合结果
kind = "python"
handler = {"type" = "file", "path" = "gen/handlers/save_results_handler.py", "function" = "save_results_handler"}
input = {"input_path" = "run/free_params.toml","output_path" = "output/free_params_fitted.toml" }
output_type = "python"
output.all = {"type" = "file", "path" = "gen/fragments/save_results.py"}

[stages.classification]
# llm分类器
kind = "llm"
prompt = {"type" = "file", "path" = "gen/prompts/classification_prompt.txt"}
human_prompt = "使用传入的{\"arg_index\": n}代替parameter_lists中变量的具体值,输出纯json，不要包含注释\n toml 配置：<<stages.config_strip.stripped_config>>"
output_type = "json"
output.all = {"type" = "file", "path" = "gen/fragments/classification.json"}
output.propagator_classification = {"type" = "direct"}
