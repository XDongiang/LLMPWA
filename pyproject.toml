[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwacg"
version = "0.1.0"
description = "LLM-Powered Partial Wave Analysis Code Generator (LLMPWA)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "caihao" }]
keywords = ["partial-wave-analysis", "code-generation", "llm", "jax"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "openai",
    "python-dotenv",
    "toml",
]

# The generator itself only needs the dependencies above. Running the *generated*
# fitting code needs the physics/numeric stack below; keep these separate so the
# generator stays lightweight.
#
# `agent/tensor` 的数值内核走 `kernels/_backend.py`：有 jax 就用 jax（生产
# 路径，GPU 加速），没有就回退 numpy。所以生成器（emit/check/show）**不需要**
# jax；`emit` 产出的脚本在无 jax 环境下也能用 numpy 跑。
[project.optional-dependencies]
runtime = [
    "jax",
    "numpy",
    "scipy",
    "pandas",
    "iminuit",
    "pynvml",
    "matplotlib",
    "tabulate",
]
# 只想跑生成器 + tensor 内核（不做拟合）时的最小集合：numpy 回退够用。
tensor = [
    "numpy",
]

[project.urls]
homepage = "https://github.com/caihao/PWACG"

[tool.setuptools]
include-package-data = true

# Only the `agent/` engine is an importable Python package; `analyses/` and
# `docker/` hold data/config and are shipped as package data, not modules.
[tool.setuptools.packages.find]
include = ["agent", "agent.*"]
